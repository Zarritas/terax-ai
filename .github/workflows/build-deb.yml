# Fork-only packaging workflow: builds the Linux .deb and uploads it as a
# workflow artifact. Unlike release.yml it needs no signing secrets and
# publishes no release — grab the bundle from the run's Artifacts section.
name: Build .deb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: build-deb

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build .deb bundle
        run: pnpm tauri build --bundles deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: terax-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
